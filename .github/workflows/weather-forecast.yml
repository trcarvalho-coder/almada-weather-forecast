name: Atualizar previsoes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validar sintaxe
        run: |
          python -m py_compile scripts/update_forecast.py

      - name: Executar previsao
        run: |
          python scripts/update_forecast.py

      - name: Confirmar ficheiros gerados
        run: |
          test -f output/relatorio_latest.md
          test -f data/dados_latest.json
          echo "Relatorio encontrado:"
          ls -lh output/relatorio_latest.md
          echo "Dados encontrados:"
          ls -lh data/dados_latest.json

      - name: Carregar relatorio como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-funchalinho
          path: |
            output/relatorio_latest.md
            data/dados_latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Guardar resultados no repositorio
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/relatorio_latest.md data/dados_latest.json

          if git diff --cached --quiet; then
            echo "Os ficheiros existem, mas nao apresentam alteracoes face a versao anterior."
          else
            git commit -m "Atualizar previsao Funchalinho"
            git push
          fi

      - name: Resumo da execucao
        run: |
          {
            echo "## Resultado"
            echo ""
            echo "Relatorio gerado com sucesso."
            echo ""
            echo "- [Abrir relatorio](../blob/${GITHUB_SHA}/output/relatorio_latest.md)"
            echo "- Artefacto: relatorio-funchalinho"
          } >> "$GITHUB_STEP_SUMMARY"
