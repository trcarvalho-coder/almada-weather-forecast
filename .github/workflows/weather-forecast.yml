name: 🌤️ Atualizar Previsões Almada

on:
  # Corre automaticamente 2x por dia
  schedule:
    - cron: '0 8 * * *'   # Todos os dias às 08:00 UTC (09:00 PT)
    - cron: '0 20 * * *'  # Todos os dias às 20:00 UTC (21:00 PT)
  
  # Permite correr manualmente (botão no GitHub)
  workflow_dispatch:

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Download do código
    - name: Checkout repositório
      uses: actions/checkout@v3
    
    # 2. Configurar Python
    - name: Configurar Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    # 3. Instalar bibliotecas necessárias
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy
    
    # 4. Executar script de previsão
    - name: Executar atualização de previsões
      run: python scripts/update_forecast.py
    
    # 5. Guardar resultados no repositório
    - name: Commit e push resultados
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Actions Weather Bot"
        git add output/ data/
        git commit -m "🌤️ Atualização automática $(date +%Y-%m-%d_%H:%M)" || echo "Sem alterações"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # 6. Criar resumo para o utilizador
    - name: Mostrar resumo
      run: |
        echo "## 📊 Resumo da Atualização" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Data:** $(date +%Y-%m-%d_%H:%M)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Previsões atualizadas com sucesso!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📁 Ver relatório: [relatorio_latest.md](output/relatorio_latest.md)" >> $GITHUB_STEP_SUMMARY
