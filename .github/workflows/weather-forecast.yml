name: Atualizar previsoes Funchalinho

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 20 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validar sintaxe
        run: |
          python -m py_compile scripts/update_forecast.py

      - name: Executar script
        run: |
          python scripts/update_forecast.py

      - name: Confirmar ficheiros gerados
        run: |
          test -f output/relatorio_latest.md
          test -f data/dados_latest.json
          echo "Relatorio:"
          wc -c output/relatorio_latest.md
          echo "Dados:"
          wc -c data/dados_latest.json

      - name: Mostrar resumo dos avisos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/dados_latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          source = data["sources"]["warnings"]

          print("Estado:", source.get("status"))
          print("Total de registos:", source.get("total_records"))
          print("Registos relevantes:", source.get("relevant_count"))
          PY

      - name: Carregar relatorio como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-funchalinho
          path: |
            output/relatorio_latest.md
            data/dados_latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Guardar resultados no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/relatorio_latest.md data/dados_latest.json

          if git diff --cached --quiet; then
            echo "Nao existem alteracoes para gravar."
          else
            git commit -m "Atualizar relatorio Funchalinho"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Resumo da execucao
        run: |
          {
            echo "## Relatorio Funchalinho"
            echo ""
            echo "Relatorio gerado e validado com sucesso."
            echo ""
            echo "O ficheiro tambem esta disponivel em Artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
