name: Atualizar previsoes Funchalinho

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 20 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validar sintaxe
        run: |
          python -m py_compile scripts/update_forecast.py

      - name: Executar script
        run: |
          python scripts/update_forecast.py

      - name: Inspecionar ficheiros gerados
        run: |
          echo "Diretorio atual:"
          pwd

          echo "Conteudo do diretorio:"
          find . -maxdepth 3 -type f | sort

          echo "Verificacao do relatorio:"
          test -f output/relatorio_latest.md

          echo "Verificacao dos dados:"
          test -f data/dados_latest.json

          echo "Tamanho do relatorio:"
          wc -c output/relatorio_latest.md

      - name: Carregar relatorio como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-funchalinho
          path: |
            output/relatorio_latest.md
            data/dados_latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Guardar resultados no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/relatorio_latest.md data/dados_latest.json

          if git diff --cached --quiet; then
            echo "Nao existem alteracoes para gravar."
          else
            git commit -m "Atualizar relatorio Funchalinho"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Resumo
        run: |
          echo "## Relatorio meteorologico" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Relatorio gerado e validado." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "O artefacto esta disponivel em Artifacts." >> "$GITHUB_STEP_SUMMARY"
